name: Fetch Media

on:
  workflow_dispatch:
    inputs:
      urls_json:
        description: 'JSON array of {"name": "...", "url": "..."}'
        required: true
      branch:
        description: 'Branch to push fetched files to'
        required: true
        default: 'media-temp'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create target branch
        run: |
          git checkout -B "${{ github.event.inputs.branch }}"

      - name: Download files
        run: |
          mkdir -p media-temp
          python3 - <<'PYEOF'
import json, urllib.request, os
items = json.loads('''${{ github.event.inputs.urls_json }}''')
for item in items:
    out_path = os.path.join("media-temp", item["name"])
    print(f"Downloading {item['url']} -> {out_path}")
    urllib.request.urlretrieve(item["url"], out_path)
PYEOF
          ls -la media-temp

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add media-temp/
          git commit -m "Fetch media files" || echo "nothing to commit"
          git push origin "${{ github.event.inputs.branch }}" --force
